  小牛的冒险

  晨光从树缝间漏下来，碎碎的金黄落在小牛阿哞的背脊上。它站在森林边缘，心跳仍然快得像鼓点，可那声呼唤又响了，从林子深处飘来，细得像一根从梦里漏出来的线头。

  阿哞竖起耳朵。那声音低低的，像风吹过干枯的草茎，又像远处低低的雷响。它回头看了一眼来路——栅栏早就看不见了，只剩一片绿茸茸的草坡。妈妈的声音还在它耳朵里打转：“别越过那道栅栏。”可它已经越过了。

  那声音又响了。这一次，阿哞觉得它在叫自己的名字。它没有多想，四腿一蹬，朝着森林深处跑去。晨光跟着它，往更深处沉进去。
