  小牛的笑容

  小牛的笑容

  晚自习的铃声还没响完，教室里已经骚动起来。我收拾好桌上的错题本，余光瞥见林小牛正趴在最后一排的课桌上，脸埋在臂弯里，肩膀微微起伏着。

  下课铃终于响了，我抱着作业本站起来。经过他身边时，小牛忽然抬起脸，咧嘴冲我笑了笑——那笑容又憨又亮，像麦田里忽然跳出一只小黄狗。他的眼圈还是红的，脸上还挂着没干透的泪痕，可他就这样笑了。

  “小牛，”我停住脚，“怎么了？”

  他摆摆手，从桌洞里掏出一个皱巴巴的信封，在我眼前晃了晃：“我妈寄来的。”

  我接过信封，看见邮票上盖着乐山的邮戳。小牛是跟着奶奶长大的，他爸妈在南方打工，一年到头只回来一两次。信封边角已经磨白了，像是被反复摩挲过。

  “她说今年回来过年。”小牛的声音有点哑，但笑意还是从眼角溢出来，“还说要给我带那边的橘子。”

  我又看了一眼那封信，信纸折成四折，字迹歪歪扭扭的，有些字用的是拼音代替。在最底下，他妈妈画了一个笑脸——一个笨拙的、圆滚滚的笑脸。

  小牛把信小心翼翼地折好，塞回信封里，又抬起头，对我露出那个笑。这一次，我看见他眼睛里闪着光。

  我什么都没说，拍了拍他的肩膀。窗外的夕阳正好斜斜地照进来，把整个教室染成暖金色。小牛的笑容在光里亮堂堂的，像一枚刚翻出来的旧硬币，虽然磨旧了，却格外沉甸甸的。
