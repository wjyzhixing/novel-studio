name: Package desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows NSIS x64
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "Dependency install failed on attempt $attempt"
            sleep 10
          done
          exit 1
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build Windows installer
        run: pnpm dist:win:x64
      - name: Verify Windows installer metadata
        run: pnpm verify:artifacts -- --platform win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: novel-studio-windows-x64
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  macos:
    name: macOS ARM64 DMG
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "Dependency install failed on attempt $attempt"
            sleep 10
          done
          exit 1
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build macOS ARM64 installer
        run: pnpm dist:mac:arm64
      - name: Verify macOS installer metadata
        run: pnpm verify:artifacts -- --platform mac
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: novel-studio-macos-arm64
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$release_tag" == v1.0.0-retry* ]]; then
            release_tag="v1.0.0"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/latest.yml \
              release-assets/latest-mac.yml \
              --clobber
            gh release edit "$release_tag" \
              --title "$release_tag" \
              --notes-file CHANGELOG.md
          else
            gh release create "$release_tag" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/latest.yml \
              release-assets/latest-mac.yml \
              --title "$release_tag" \
              --notes-file CHANGELOG.md \
              --verify-tag
          fi
