name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint boundaries
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test -- --maxWorkers=1
      - name: Production build
        run: pnpm build
      - name: Electron golden path
        run: xvfb-run --auto-servernum pnpm e2e:electron
      - name: Verify packaging configuration
        run: pnpm verify:packaging
      - name: Run release preflight
        run: node scripts/release-preflight.mjs
